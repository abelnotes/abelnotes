<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="AbelNotes — handwritten notes with LaTeX and PDF annotation, offline-first.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AbelNotes">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>AbelNotes</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="margin:0;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none">
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!--
    google_sign_in_web adds Google's sign-in script as soon as the app boots,
    so every launch called accounts.google.com although the web build has no
    Google sign-in. Hold it back; window.abelnotesLoadGis() lets it load.
  -->
  <script>
    (function () {
      var head = document.head, append = head.appendChild, held = [];
      head.appendChild = function (n) {
        if (n instanceof HTMLScriptElement &&
            String(n.src).indexOf('https://accounts.google.com/gsi/') === 0) {
          held.push(n);
          return n;
        }
        return append.call(head, n);
      };
      window.abelnotesLoadGis = function () {
        held.splice(0).forEach(function (n) { append.call(head, n); });
      };
    })();
  </script>
  <!--
    Offline support. Flutter's own loader only reuses a service worker that is
    already registered, so register ours (tool/build_web.sh drops it in under
    this file name) before the app boots.
  -->
  <script>
    if ('serviceWorker' in navigator) {
      // Safari checks a registered worker for a new build only about once a
      // day; ask on every launch so a deploy arrives on the next open.
      navigator.serviceWorker.register('flutter_service_worker.js')
          .then(function (r) { return r.update(); })
          .catch(function () {});
    }
  </script>
  <!--
    Fast short Apple Pencil strokes look like taps to iPadOS Safari: the second
    of two quick ones was taken as a double tap and never reached the page,
    so every other stroke vanished (flutter/flutter#172865). Cancelling the
    stylus touchend stops the tap from counting; touchmove keeps Scribble off
    the canvas. Finger touches are left alone. tldraw does the same (#5888).
  -->
  <script>
    (function () {
      function isPen(e) {
        for (var i = 0; i < e.changedTouches.length; i++) {
          if (e.changedTouches[i].touchType === 'stylus') return true;
        }
        return false;
      }
      ['touchmove', 'touchend'].forEach(function (t) {
        document.addEventListener(t, function (e) {
          if (isPen(e)) e.preventDefault();
        }, { capture: true, passive: false });
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
