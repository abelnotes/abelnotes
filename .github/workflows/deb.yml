name: Debian package

# Builds the Linux release and wraps it with tool/build_deb.sh, so the .deb
# that tool produces is checked on every change to it.
on:
  push:
    paths: ['tool/build_deb.sh', 'tool/strip_build_rpath.py', 'linux/**', 'pubspec.*', '.github/workflows/deb.yml']
  pull_request:
    paths: ['tool/build_deb.sh', 'tool/strip_build_rpath.py', 'linux/**', 'pubspec.*', '.github/workflows/deb.yml']
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in sync with build.yml.
  FLUTTER_VERSION: '3.44.0'

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: >-
          sudo apt-get update && sudo apt-get install -y
          clang cmake ninja-build pkg-config fakeroot
          libgtk-3-dev libsecret-1-dev libsqlite3-dev
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # pdfrx ships PDFium as a native asset, not a cmake plugin.
      - run: flutter config --enable-native-assets
      - run: flutter pub get
      # Drive stays "not available in this build" when the secrets are unset.
      - run: >-
          ./tool/build_deb.sh --rebuild --
          --dart-define=GIT_COMMIT=${{ github.sha }}
          --dart-define=GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          --dart-define=GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
      # PDFium and the Rust plugins fail silently at build time and loudly at
      # runtime, so assert they made it into the package.
      - name: Verify bundled native libraries
        run: |
          deb=$(ls build/deb/*.deb)
          for lib in libpdfium.so libsuper_native_extensions.so libonenote_bridge.so; do
            dpkg-deb -c "$deb" | grep -q "/$lib" || { echo "missing $lib"; exit 1; }
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: abelnotes-deb
          path: build/deb/*.deb
          if-no-files-found: error
